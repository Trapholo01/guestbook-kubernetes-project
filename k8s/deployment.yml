apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: guestbook
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: guestbook
    spec:
      # If using a private registry, uncomment and set imagePullSecrets:
      # imagePullSecrets:
      #   - name: my-registry-secret
      containers:
      - name: guestbook
        # Default for local clusters: use guestbook:v1 and ImagePullPolicy IfNotPresent.
        # Replace with your IBM registry path if you prefer (e.g. us.icr.io/<your-namespace>/guestbook:v1).
        image: guestbook:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
          limits:
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
